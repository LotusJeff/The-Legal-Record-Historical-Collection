name: Daily PDF Monitor

on:
  schedule:
    # Runs every day at 8:00 AM UTC (adjust to your preferred time)
    # Use https://crontab.guru to customize
    - cron: "0 8 * * *"
  workflow_dispatch:  # Allows manual triggering from the GitHub UI

jobs:
  check-pdf:
    runs-on: ubuntu-latest

    # Give the workflow permission to commit changes back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run PDF monitor
        env:
          PDF_URL:            ${{ vars.PDF_URL }}
          MAILJET_API_KEY:    ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          SENDER_EMAIL:       ${{ vars.SENDER_EMAIL }}
          SENDER_NAME:        ${{ vars.SENDER_NAME }}
          MAILING_LIST:       ${{ secrets.MAILING_LIST }}
        run: python check_pdf.py

      - name: Commit updated hash and PDF (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_hash.txt pdfs/ || true
          git diff --cached --quiet || git commit -m "chore: update PDF snapshot $(date -u +'%Y-%m-%d')"
          git push
